# One-off: provision preview-only D1 + KV, apply migrations, and write the ids
# into the `previews` block of wrangler.json. Idempotent. Delete after it runs.
name: Provision preview resources

on:
  workflow_dispatch:
  push:
    branches: [arena/01a0f937-bnji-net]
    paths: [.github/workflows/provision-previews.yml]

permissions:
  contents: write

concurrency:
  group: provision-previews
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PREVIEW_D1_NAME: bnji-board-preview
  PREVIEW_KV_TITLE: bnji-board-preview-kv

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Create (or find) preview KV namespace and D1 database
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          kv_id=$(curl -fsS -H "$auth" "$api/storage/kv/namespaces?per_page=100" \
            | jq -r --arg t "$PREVIEW_KV_TITLE" '.result[] | select(.title==$t) | .id' | head -n1)
          if [ -z "$kv_id" ]; then
            kv_id=$(curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" \
              --data "{\"title\":\"$PREVIEW_KV_TITLE\"}" "$api/storage/kv/namespaces" | jq -r '.result.id')
          fi

          d1_id=$(curl -fsS -H "$auth" "$api/d1/database?name=$PREVIEW_D1_NAME" \
            | jq -r --arg n "$PREVIEW_D1_NAME" '.result[] | select(.name==$n) | .uuid' | head -n1)
          if [ -z "$d1_id" ]; then
            d1_id=$(curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" \
              --data "{\"name\":\"$PREVIEW_D1_NAME\"}" "$api/d1/database" | jq -r '.result.uuid')
          fi

          [ -n "$kv_id" ] && [ "$kv_id" != null ] && [ -n "$d1_id" ] && [ "$d1_id" != null ]
          echo "KV_ID=$kv_id" >> "$GITHUB_ENV"
          echo "D1_ID=$d1_id" >> "$GITHUB_ENV"
          echo "KV namespace: $kv_id"
          echo "D1 database:  $d1_id"

      - name: Apply migrations to the preview database
        run: |
          set -euo pipefail
          cat > wrangler.provision.json <<JSON
          {
            "name": "provision-tmp",
            "compatibility_date": "2026-09-14",
            "d1_databases": [
              {
                "binding": "BOARD_DB",
                "database_name": "${PREVIEW_D1_NAME}",
                "database_id": "${D1_ID}",
                "migrations_dir": "migrations"
              }
            ]
          }
          JSON
          npx wrangler d1 migrations apply "$PREVIEW_D1_NAME" --remote --config wrangler.provision.json
          rm wrangler.provision.json

      - name: Write ids into wrangler.json (previews block only)
        run: |
          node - <<'JS'
          const fs = require("fs");
          const cfg = JSON.parse(fs.readFileSync("wrangler.json", "utf8"));
          const { KV_ID, D1_ID, PREVIEW_D1_NAME } = process.env;
          if (D1_ID === cfg.d1_databases[0].database_id || KV_ID === cfg.kv_namespaces[0].id) {
            throw new Error("Refusing: preview id equals production id");
          }
          const p = cfg.previews;
          p.d1_databases[0].database_name = PREVIEW_D1_NAME;
          p.d1_databases[0].database_id = D1_ID;
          p.kv_namespaces[0].id = KV_ID;
          fs.writeFileSync("wrangler.json", JSON.stringify(cfg, null, "\t") + "\n");
          JS
          git diff --stat

      - name: Commit and push
        run: |
          if git diff --quiet -- wrangler.json; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wrangler.json
          git commit -m "Isolate Workers Previews: point previews at preview-only D1 and KV"
          git push origin "HEAD:${{ github.ref_name }}"
