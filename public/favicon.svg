<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
	<!--
		BNJI favicon: a four-point star inside an orbit ring on near-black glass.
		Matches BrandMark.astro and public/og-cover.svg so the mark is identical
		in the tab, on the home screen and in a social card.
	-->
	<defs>
		<linearGradient id="bnji-bg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#0d1119" />
			<stop offset="1" stop-color="#020204" />
		</linearGradient>
		<linearGradient id="bnji-star" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#ffffff" />
			<stop offset="0.55" stop-color="#d6ebff" />
			<stop offset="1" stop-color="#6fb2e8" />
		</linearGradient>
	</defs>

	<rect x="1" y="1" width="62" height="62" rx="15" fill="url(#bnji-bg)" stroke="#ffffff" stroke-opacity="0.14" />
	<circle cx="32" cy="32" r="21.5" fill="none" stroke="#7fd4ff" stroke-opacity="0.3" stroke-width="1.1" />
	<path
		d="M32 9.8c1.4 9.7 4.3 15 8.5 17.7 2.5 1.6 5.4 2.4 8.4 2.7-3 .3-5.9 1.1-8.4 2.7-4.2 2.7-7.1 8-8.5 17.7-1.4-9.7-4.3-15-8.5-17.7-2.5-1.6-5.4-2.4-8.4-2.7 3-.3 5.9-1.1 8.4-2.7 4.2-2.7 7.1-8 8.5-17.7Z"
		fill="url(#bnji-star)"
	/>
	<circle cx="49.5" cy="15" r="2" fill="#7fd4ff" fill-opacity="0.75" />
	<circle cx="15.5" cy="47" r="1.3" fill="#ffffff" fill-opacity="0.5" />
</svg>
